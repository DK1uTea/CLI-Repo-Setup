x-database-url: &database-url
  postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-{{projectNameDb}}}

services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: {{sanitizedProjectName}}-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-{{projectNameDb}}}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-{{projectNameDb}}}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: {{sanitizedProjectName}}-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    # Fix #3: require password authentication
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      # Fix #3: pass password to redis-cli in healthcheck
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    # Separate target: has full node_modules (including prisma CLI devDep).
    # Ephemeral by design — runs once then exits (restart: no).
    image: {{sanitizedProjectName}}/migrate:latest
    build:
      context: .
      dockerfile: apps/{{sanitizedProjectName}}/Dockerfile
      target: migrator
    container_name: {{sanitizedProjectName}}-migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    image: {{sanitizedProjectName}}/api:latest
    build:
      context: .
      dockerfile: apps/{{sanitizedProjectName}}/Dockerfile
      target: runner
    container_name: {{sanitizedProjectName}}-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-3000}:3000'
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      REDIS_HOST: redis
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  tcp-server:
    image: {{sanitizedProjectName}}/tcp-server:latest
    build:
      context: .
      dockerfile: apps/tcp-server/Dockerfile
      target: runner
    container_name: {{sanitizedProjectName}}-tcp-server
    restart: unless-stopped
    ports:
      - '${TCP_PORT_1:-5023}:5023'   # GT06 binary protocol
      - '${TCP_PORT_2:-9942}:9942'   # CANTRACK ASCII protocol
      - '${HEALTH_HTTP_PORT:-8080}:8080' # Health check endpoint
    env_file: .env
    environment:
      # Override .env values with Docker-internal networking
      NODE_ENV: production
      DATABASE_URL: *database-url
      REDIS_HOST: redis
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G    # Node.js với nhiều TCP connections
          cpus: '1.0'
        reservations:
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  worker:
    image: {{sanitizedProjectName}}/worker:latest
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runner
    container_name: {{sanitizedProjectName}}-worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      REDIS_HOST: redis
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

volumes:
  timescale_data:
  redis_data:
